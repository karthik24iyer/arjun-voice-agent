# Echo-cancelled mic for the Hey Arjun assistant: removes whatever the PC is playing from the mic.
# Install to ~/.config/pipewire/pipewire.conf.d/ and set target.object to your mic (`pactl list short sources`).
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      monitor.mode = true
      capture.props = {
        node.name = "arjun_ec_capture"
        target.object = "YOUR_MIC_SOURCE_NAME"
        node.passive = true
      }
      source.props = {
        node.name = "arjun_ec_source"
        node.description = "Mic (echo-cancelled)"
      }
    }
  }
]
